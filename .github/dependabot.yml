version: 2

# Each action is published on its own branch, so Dependabot needs one entry per
# branch: target-branch selects which branch is read and where the PR is opened.
#
# This list is maintained by hand and must be kept in step with the branches.
# Publishing a new version branch without adding an entry here leaves that
# action without dependency updates, and nothing reports it: the branch is
# simply never checked. Delete the entry when a branch is retired.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dependabot-slack/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "ecs-run-task/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "ecs-service-update/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "gh-pages-publish/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "mirror/v3"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "publish-hugo-site/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "slack-notify/v1"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "update-task-def/v2"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7       # Wait 7 days for any update
