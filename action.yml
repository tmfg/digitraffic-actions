name: 'Mirror action'
description: 'Mirror changes to another repository'
inputs:
  refspec:
    description: 'Refspec used in push'
    required: false
    default: 'master'
  mirror-repo:
    description: 'Mirroring to'
    required: true
  ssh-private-key:
    description: 'Private key'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Mask repo
      run: |
          DT_MIRROR_REPO=${{ inputs.mirror-repo }}
          echo "::add-mask::$DT_MIRROR_REPO"
          echo "DT_MIRROR_REPO=$DT_MIRROR_REPO" >> $GITHUB_ENV
      shell: bash
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - run: git push --follow-tags $DT_MIRROR_REPO ${{ inputs.refspec }} > /dev/null 2>&1
      shell: bash
