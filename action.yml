name: Build and deploy Hugo site to Pages
description: Builds and deploys a Hugo site to Github Pages with given configuration file

inputs:
  HUGO_VERSION:
    required: true
  CONFIG_FILE_PATH:
    required: false
    default: config.yml
  BRANCH:
    required: false
    default: ${{ github.event.repository.default_branch }}

runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      run: |
        wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{inputs.HUGO_VERSION}}/hugo_extended_${{inputs.HUGO_VERSION}}_linux-amd64.deb \
        && sudo dpkg -i ${{ runner.temp }}/hugo.deb
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.BRANCH }}
        submodules: recursive
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Build with Hugo
      env:
        # For maximum backward compatibility with Hugo modules
        HUGO_ENVIRONMENT: production
        HUGO_ENV: production
      shell: bash
      run: |
        hugo \
          --baseURL "${{ steps.pages.outputs.base_url }}" \
          --minify \
          --config ${{ inputs.CONFIG_FILE_PATH }}
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./public
    - name: Wait for Pages artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        delay=2
        for attempt in {1..6}; do
          if artifacts=$(curl --connect-timeout 5 --max-time 10 --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"); then
            if jq -e '.artifacts | any(.[]; .name == "github-pages" and (.expired | not))' <<< "$artifacts" > /dev/null; then
              echo "Pages artifact is available."
              exit 0
            fi
          else
            echo "Failed to query GitHub Actions artifacts (attempt $attempt/6)." >&2
          fi

          if [ "$attempt" -eq 6 ]; then
            echo "Pages artifact could not be confirmed after $attempt attempts." >&2
            exit 1
          fi

          echo "Pages artifact is not visible yet or the API request failed; retrying in ${delay}s (attempt $attempt/6)."
          sleep "$delay"
          delay=$((delay * 2))
          if [ "$delay" -gt 30 ]; then
            delay=30
          fi
        done
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
