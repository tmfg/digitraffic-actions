name: 'Mirror action'
description: 'Mirror changes to another repository'
inputs:
  refspec:
    description: 'Refspec used in push'
    required: false
    default: 'master'
  mirror-repo:
    description: 'Mirroring to'
    required: true
  ssh-private-key:
    description: 'Private key'
    required: true
  verbose:
    description: 'Enable verbose output for debugging (true/false)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Mask repo
      run: |
        echo "::add-mask::${{ inputs.mirror-repo }}"
        echo "DT_MIRROR_REPO=${{ inputs.mirror-repo }}" >> $GITHUB_ENV
      shell: bash
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Push to mirror
      run: |
        set -e
        if [ "${{ inputs.verbose }}" = "true" ]; then
          git push --follow-tags --verbose $DT_MIRROR_REPO ${{ inputs.refspec }} || {
            echo "::error::Push to mirror failed"
            exit 1
          }
        else
          # Capture output but show errors on failure
          output=$(git push --follow-tags $DT_MIRROR_REPO ${{ inputs.refspec }} 2>&1) || {
            echo "::error::Push to mirror failed"
            echo "$output" >&2
            exit 1
          }
        fi
      shell: bash
