name: 'Mirror action'
description: 'Mirror changes to another repository'
inputs:
  refspec:
    description: 'Refspec used in push'
    required: false
    default: 'master'
  mirror-repo:
    description: 'Mirroring to'
    required: true
  ssh-private-key:
    description: 'Private key'
    required: true
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - run: |
        set -xe
        echo "Mirror repo: ${{ inputs.mirror-repo }}"
        echo "Refspec: ${{ inputs.refspec }}"
        git remote -v
        git branch -a
        git push --verbose --follow-tags ${{ inputs.mirror-repo }} ${{ inputs.refspec }}
      shell: bash
