name: 'Notify Slack'
description: >
  Send a colour-coded Slack notification via Incoming Webhook.
  Drop-in replacement for the deprecated 8398a7/action-slack action,
  covering the subset of features used in Digitraffic workflows.

inputs:
  status:
    description: 'Job status: success or failure'
    required: true
  text:
    description: 'Main message text (supports Slack mrkdwn)'
    required: true
  fields:
    description: >
      Comma-separated metadata fields to include.
      Supported: repo, job, took
    required: false
    default: ''
  job_name:
    description: 'Override the job name shown in the "Job" field (defaults to github.job)'
    required: false
    default: ''
  webhook-url:
    description: 'Slack Incoming Webhook URL'
    required: true

runs:
  using: composite
  steps:
    - name: Build and send Slack notification
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_FIELDS: ${{ inputs.fields }}
        INPUT_JOB_NAME: ${{ inputs.job_name }}
        INPUT_WEBHOOK_URL: ${{ inputs.webhook-url }}
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_JOB: ${{ github.job }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_RUN_NUMBER: ${{ github.run_number }}
        GH_WORKFLOW: ${{ github.workflow }}
        GH_API_URL: ${{ github.api_url }}
      run: |
        node <<'SCRIPT'
        const env = process.env;

        const STATUS_COLORS = {
          success: "#2eb886",
          failure: "#a30200",
        };

        function formatDuration(seconds) {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        }

        async function fetchRunDuration() {
          try {
            const url = `${env.GH_API_URL}/repos/${env.GH_REPOSITORY}/actions/runs/${env.GH_RUN_ID}`;
            const res = await fetch(url, {
              headers: {
                "Authorization": `Bearer ${env.GH_TOKEN}`,
                "Accept": "application/vnd.github+json",
              },
            });
            const { run_started_at } = await res.json();
            if (!run_started_at) return "N/A";

            const elapsed = Math.round((Date.now() - new Date(run_started_at).getTime()) / 1000);
            return formatDuration(elapsed);
          } catch {
            return "N/A";
          }
        }

        async function buildFields() {
          const fieldNames = env.INPUT_FIELDS.split(",").map(f => f.trim()).filter(Boolean);
          if (fieldNames.length === 0) return [];

          const jobName = env.INPUT_JOB_NAME || env.GH_JOB;
          const took = fieldNames.includes("took") ? await fetchRunDuration() : undefined;

          const allFields = {
            repo:        { title: "Repository", value: `<${env.GH_SERVER_URL}/${env.GH_REPOSITORY}|${env.GH_REPOSITORY}>` },
            job:         { title: "Job", value: jobName },
            took:        { title: "Took", value: took },
          };

          return fieldNames
            .filter(name => allFields[name])
            .map(name => ({ ...allFields[name], short: true }));
        }

        async function main() {
          const color = STATUS_COLORS[env.INPUT_STATUS] ?? "#cccccc";
          const fields = await buildFields();
          const runUrl = `${env.GH_SERVER_URL}/${env.GH_REPOSITORY}/actions/runs/${env.GH_RUN_ID}`;
          const text = `${env.INPUT_TEXT}\n<${runUrl}|${env.GH_WORKFLOW} #${env.GH_RUN_NUMBER}>`;

          const payload = {
            attachments: [{
              color,
              text,
              fields,
            }],
          };

          console.log("::group::Slack payload");
          console.log(JSON.stringify(payload, null, 2));
          console.log("::endgroup::");

          const res = await fetch(env.INPUT_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            console.log(`Slack notification sent successfully (HTTP ${res.status})`);
          } else {
            throw new Error(`Slack notification failed with HTTP ${res.status}`);
          }
        }

         main().catch((error) => {
           console.error("Slack notification failed:", error);
           process.exitCode = 1;
         });
        SCRIPT
